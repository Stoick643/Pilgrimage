{% extends "base.html" %}

{% block title %}Your Itinerary — {{ country }}{% endblock %}

{% block body %}
<div class="container py-5" style="max-width: 900px;">
    <div class="text-center mb-4">
        <h1><i class="bi bi-map"></i> {{ country }} — {{ duration }} Days</h1>
    </div>

    <div id="stream-status" class="text-center my-4">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted mt-2" id="progress-text">AI is planning your trip...</p>
        <div class="progress mt-2" style="height: 4px; max-width: 300px; margin: 0 auto;">
            <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 5%"></div>
        </div>
    </div>

    <!-- Day cards appear here -->
    <div id="days"></div>

    <!-- SSE connection — streams day cards from server -->
    <div hx-ext="sse"
         sse-connect="/api/stream-html/{{ request_id }}">
        <div sse-swap="day"
             hx-target="#days"
             hx-swap="beforeend"></div>
        <div sse-swap="progress"
             hx-target="#progress-bar"
             hx-swap="none"></div>
        <div sse-swap="complete"
             hx-target="#stream-status"
             hx-swap="innerHTML"></div>
    </div>

    <!-- Map section (hidden until complete) -->
    <div id="map-section" class="d-none mt-5">
        <h2 class="text-center mb-3"><i class="bi bi-signpost-2"></i> Map of Your Trip</h2>
        <div id="map" style="height: 450px; border-radius: 12px;"></div>
    </div>

    <div class="text-center mt-5">
        <a href="/" class="btn btn-outline-secondary btn-lg">
            <i class="bi bi-arrow-left"></i> Plan Another Trip
        </a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const country = {{ country | tojson }};
    const googleApiKey = {{ google_api_key | tojson }};
    const cities = [];

    // Update progress bar on progress events
    document.body.addEventListener('htmx:sseMessage', function(evt) {
        if (evt.detail.type === 'progress') {
            const pct = parseInt(evt.detail.data) || 0;
            const bar = document.getElementById('progress-bar');
            if (bar) bar.style.width = pct + '%';
            const messages = [
                'AI is planning your trip...',
                'Choosing the best destinations...',
                'Crafting your day-by-day plan...',
                'Adding the finishing touches...',
            ];
            const txt = document.getElementById('progress-text');
            if (txt) txt.textContent = messages[Math.min(Math.floor(pct / 25), messages.length - 1)];
        }
    });

    // When a day card is added, extract city name
    document.body.addEventListener('htmx:sseMessage', function(evt) {
        if (evt.detail.type === 'day') {
            // Use a timeout to let htmx finish swapping
            setTimeout(function() {
                document.querySelectorAll('#days [data-city]').forEach(function(card) {
                    const city = card.dataset.city;
                    if (!cities.includes(city)) cities.push(city);
                });
            }, 100);
        }
    });

    // When stream completes
    document.body.addEventListener('htmx:sseMessage', function(evt) {
        if (evt.detail.type === 'complete') {
            document.getElementById('stream-status').innerHTML =
                '<p class="text-success"><i class="bi bi-check-circle"></i> Itinerary complete!</p>';
            loadMap();
        }
    });

    function loadMap() {
        if (!cities.length || !googleApiKey) return;
        document.getElementById('map-section').classList.remove('d-none');

        const script = document.createElement('script');
        script.src = 'https://maps.googleapis.com/maps/api/js?key=' + googleApiKey + '&callback=initMap';
        window.initMap = function() {
            fetch('/api/geocode?cities=' + encodeURIComponent(cities.join(',')))
                .then(r => r.json())
                .then(function(data) {
                    const locs = data.locations;
                    if (!locs || !locs.length) return;
                    const map = new google.maps.Map(document.getElementById('map'), {
                        zoom: 6, center: { lat: locs[0].lat, lng: locs[0].lng }
                    });
                    if (locs.length >= 2) {
                        const ds = new google.maps.DirectionsService();
                        const dr = new google.maps.DirectionsRenderer();
                        dr.setMap(map);
                        ds.route({
                            origin: new google.maps.LatLng(locs[0].lat, locs[0].lng),
                            destination: new google.maps.LatLng(locs[locs.length-1].lat, locs[locs.length-1].lng),
                            waypoints: locs.slice(1, -1).map(l => ({
                                location: new google.maps.LatLng(l.lat, l.lng), stopover: true
                            })),
                            optimizeWaypoints: true,
                            travelMode: 'DRIVING'
                        }, function(result, status) {
                            if (status === 'OK') dr.setDirections(result);
                        });
                    } else {
                        locs.forEach(l => new google.maps.Marker({
                            position: { lat: l.lat, lng: l.lng }, map: map, title: l.name
                        }));
                    }
                });
        };
        document.head.appendChild(script);
    }
</script>
{% endblock %}
