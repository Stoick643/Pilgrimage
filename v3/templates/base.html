<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Couch Traveller{% endblock %}</title>

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:title" content="{% block og_title %}Couch Traveller — AI Travel Planner{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Plan your perfect trip with AI. Day-by-day itineraries with photos, weather, and interactive maps.{% endblock %}">
    <meta property="og:image" content="{% block og_image %}/static/images/Mojca.jpg{% endblock %}">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}" style="background-color: #fafaf8;">
    {% block body %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
